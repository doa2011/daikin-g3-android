name: Android debug APK
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK platform and build tools
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download and verify upstream G3 ESP32 OTA image
        run: bash scripts/prepare_g3_firmware.sh
      - name: Download and verify upstream G3 screen MCU image
        run: |
          mkdir -p app/src/main/assets/g3
          curl --fail --location --retry 3 \
            https://github.com/phicomm-io/iotcloud-bry88bba15g-screenmcu/releases/download/screen-c59386c429871bc26339c7a6a19cfd5623241814/screen_firmware.bin \
            -o app/src/main/assets/g3/daikin_G3_screen.bin
          echo "9cafaae14b47afd03c3bc0f53b63f4b7a2a99225ac0732ba39a8a6f18c3bf6c9  app/src/main/assets/g3/daikin_G3_screen.bin" | sha256sum --check
          test "$(stat -c%s app/src/main/assets/g3/daikin_G3_screen.bin)" = "421888"
      - name: Run BLUFi and Android unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: g3-provision-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error